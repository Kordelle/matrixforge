services:
  compute:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "7431:7431"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7431/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7430:7430"
    env_file:
      - .env.local
    environment:
      - FASTAPI_URL=http://compute:7431
    depends_on:
      compute:
        condition: service_healthy
